name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - lab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: lab

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python install -r app/requirements_flask.txt

      - name: Run tests
        run: pytest tests
    
